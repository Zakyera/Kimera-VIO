%YAML:1.0
#TRACKER PARAMETERS
klt_win_size: 31
klt_max_iter: 30
klt_max_level: 5
klt_eps: 0.1
maxFeatureAge: 25 

# Detector Params
# 0: FAST
# 1: ORB
# 2: AGAST
# 3: GFTT, aka Good Features To Track
feature_detector_type: 3
maxFeaturesPerFrame: 900 

# Good Features To Track specific parameters
quality_level: 0.0005
min_distance: 10
block_size: 3
use_harris_detector: 0
k: 0.04

# FAST detector specific parameters [10, 20]
fast_thresh: 10

equalizeImage: 1
nominalBaseline: 0.05
toleranceTemplateMatching: 0.15
templ_cols: 101 #must be odd
templ_rows: 11
stripe_extra_rows: 0
minPointDist: 0.5
maxPointDist: 30
bidirectionalMatching: 0

# Non-maximum suppression params
max_nr_keypoints_before_anms: 1500
enable_non_max_suppression: 1
non_max_suppression_type: 6
nr_horizontal_bins: 7
nr_vertical_bins: 5
binning_mask: []

# Subpixel corner refinement for the monocular case
enable_subpixel_corner_finder: 1
max_iters: 40
epsilon_error: 0.001
window_size: 10
zero_zone: -1

subpixelRefinementStereo: 0
useSuccessProbabilities: 1
useRANSAC: 1
minNrMonoInliers: 10
minNrStereoInliers: 5
ransac_threshold_mono: 1e-06
ransac_threshold_stereo: 1
ransac_use_1point_stereo: 1
ransac_use_2point_mono: 1
ransac_max_iterations: 100
ransac_probability: 0.995
ransac_randomize: 0
min_intra_keyframe_time: 0.1
max_intra_keyframe_time: 10.0
max_disparity_since_lkf: 200 #large value to disable
minNumberFeatures: 50
useStereoTracking: 0
disparityThreshold: 0.5
# Type of optical flow predictor to aid feature tracking:
# 0: Static - assumes no optical flow between images (aka static camera).
# 1: Rotational - use IMU gyro to estimate optical flow.
optical_flow_predictor_type: 1

# 2D-2D pose estimation method
use_2d2d_tracking: 0
2d2d_algorithm: 0 # Nister
optimize_2d2d_pose_from_inliers: 0

# 3D-3D pose estimation
use_3d3d_tracking: 0
optimize_3d3d_pose_from_inliers: 0

# 2D-3D pose estimation method
use_pnp_tracking: 0
pnp_algorithm: 3 # EPNP
min_pnp_inliers: 10
ransac_threshold_pnp: 1.0 # pixels
optimize_2d3d_pose_from_inliers: 0

# xfeat params
xfeat_path: /workspaces/src/xfeat-cpp/onnx_model/xfeat_320x224.onnx
interp_bilinear_path: /workspaces/src/xfeat-cpp/onnx_model/interpolator_bilinear_320x224.onnx
interp_bicubic_path: /workspaces/src/xfeat-cpp/onnx_model/interpolator_bicubic_320x224.onnx
interp_nearest_path: /workspaces/src/xfeat-cpp/onnx_model/interpolator_nearest_320x224.onnx
xfeat_use_gpu: 1
matcher_type: 0 # 0: Brute Force, 1: FLANN, 2: LighterGlue

feature_tracker_type: 1 # 0: OpticalFlow, 1: LighterGlue 2: Flann 3: GpuBFMatcher
num_features: 1000
lg_model_path: /workspaces/src/xfeat-cpp/onnx_model/lg_320x224_dyn.onnx
gpu_bf_min_sim: 0.3 # Minimum similarity for GpuBFMatcher
search_radius: 80

track_on_keyframe: 1
min_lmk_merge_sim: 0.5
max_lmk_merge_px: 0

vilib_cell_width: 16
vilib_cell_height: 16
vilib_downsample: 1
vilib_downsample_scale: 0.5

kf_queue_size: 10
rematch_threshold: 0.5

xfeat_use_of_points: 1

copy_optical_flow_tracks: 1

# General stereo parameters (used by all methods)
minDisparity: 10
numDisparities: 128  # Must be divisible by 16
sadWindowSize: 61
uniquenessRatio: 0.8
speckleWindowSize: 100
speckleRange: 2
disp12MaxDiff: 1

# SGBM-specific parameters (for OpenCV_SGBM and LibSGM)
# P1: Penalty for small disparity changes
# Typical formula: 8 * channels * block_size^2
# For grayscale with sadWindowSize=15: 8 * 1 * 225 = 1800
P1: 10

# P2: Penalty for large disparity changes  
# Typical formula: 32 * channels * block_size^2
# Should be > P1, typically 4x P1
# For grayscale with sadWindowSize=15: 32 * 1 * 225 = 7200
P2: 120

# Use Hirschmuller mode (MODE_HH) for OpenCV_SGBM - more accurate but slower
useModeHH: false

# LibSGM downscale factor (1=no downscale, 2=half resolution)
sgmDownscaleFactor: 1

# Block Matching parameters (for OpenCV_BM only)
preFilterCap: 31
preFilterType: 1
preFilterSize: 9
textureThreshold: 10

# Post-processing options
postFilterDisparity: 0
medianBlurDisparity: 0

# Deep learning stereo parameters (for LightStereo/ONNX_Stereo)
# Uncomment and adjust for deep learning methods:
# stereoDepthMethod: LightStereo
# enginePath: /workspaces/src/xfeat-cpp/onnx_model/LightStereo-S-KITTI_480x640.engine
# dispWidth: 640
# dispHeight: 480

stereoDepthMethod: ONNX_Stereo
enginePath: /workspaces/src/ONNX-FastACVNet-Depth-Estimation/models/fast_acvnet_plus_generalization_opset11_288x512.onnx
# enginePath: /workspaces/src/ONNX-FastACVNet-Depth-Estimation/models/fast_acvnet_plus_generalization_opset11_288x512.onnx
dispWidth: 512
dispHeight: 288
onnxWarmupIterations: 3

rectifiedInputs: 1

use_sky_segmentation_filter: 1
sky_seg_engine_path: /workspaces/src/xfeat-cpp/onnx_model/skyseg.engine
